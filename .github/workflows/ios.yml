name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 25

    env:
      PROJECT: Rclone GUI.xcodeproj
      SCHEME: Rclone GUI
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -20
          swift --version

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build RcloneKit.xcframework (gomobile)
        run: ./scripts/build-rclone.sh

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            -only-testing:"Rclone GUITests" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

  archive-dry-run:
    name: Archive (dry run, unsigned)
    runs-on: macos-26
    timeout-minutes: 60

    env:
      PROJECT: Rclone GUI.xcodeproj
      SCHEME: Rclone GUI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build RcloneKit.xcframework (gomobile, ~20min)
        run: |
          ./scripts/build-rclone.sh

      - name: Build generic iOS device archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RcloneGUI-CI.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Add ad-hoc signature for entitlement preservation
        run: |
          set -euo pipefail
          APP="build/RcloneGUI-CI.xcarchive/Products/Applications/RcloneGUI.app"
          TMP="$(mktemp -d)"
          expand_entitlements() {
            sed \
              -e 's/\$(AppIdentifierPrefix)/0000000000./g' \
              -e 's/\$(TeamIdentifierPrefix)/0000000000./g' \
              "$1" > "$2"
          }
          sign_plain() { codesign --force --sign - --timestamp=none "$1"; }
          sign_with() { codesign --force --sign - --timestamp=none --entitlements "$2" "$1"; }

          # Sign nested framework binaries first.
          while IFS= read -r -d '' binary; do sign_plain "$binary"; done < <(
            find "$APP/Frameworks" -type f -perm -111 -print0
          )

          # Sign each extension independently with its target's entitlements.
          while IFS= read -r -d '' appex; do
            while IFS= read -r -d '' binary; do sign_plain "$binary"; done < <(
              find "$appex" -type f -perm -111 -print0
            )
            case "$(basename "$appex")" in
              RcloneFileProvider.appex)
                expand_entitlements "RcloneFileProvider/RcloneFileProvider.entitlements" "$TMP/fileprovider.plist"
                sign_with "$appex" "$TMP/fileprovider.plist" ;;
              *) sign_plain "$appex" ;;
            esac
          done < <(find "$APP/PlugIns" -type d -name '*.appex' -prune -print0)

          expand_entitlements "Rclone GUI/Rclone GUI.entitlements" "$TMP/main.plist"
          sign_with "$APP" "$TMP/main.plist"
          codesign --display --entitlements :- "$APP" || true
          for appex in "$APP"/PlugIns/*.appex; do
            codesign --display --entitlements :- "$appex" || true
          done

      - name: Verify archive structure
        run: |
          APP="build/RcloneGUI-CI.xcarchive/Products/Applications/RcloneGUI.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: archive missing the .app bundle"
            ls -la "build/RcloneGUI-CI.xcarchive/Products/Applications/" || true
            exit 1
          fi
          echo "Archive structure OK"
          du -sh "build/RcloneGUI-CI.xcarchive"

      - name: Package unsigned IPA
        run: |
          APP="build/RcloneGUI-CI.xcarchive/Products/Applications/RcloneGUI.app"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../RcloneGUI-unsigned.ipa Payload)
          ls -lh build/RcloneGUI-unsigned.ipa

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: RcloneGUI-unsigned-xcarchive
          path: build/RcloneGUI-CI.xcarchive

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RcloneGUI-unsigned-ipa
          path: build/RcloneGUI-unsigned.ipa

  build-macos:
    name: Build (macOS, unsigned)
    # Garde de non-régression : l'app cible aussi macOS, mais seul le simulateur
    # iOS était vérifié en CI. Des API iOS-only non gardées (ex. Handoff :
    # textInputAutocapitalization, UIPasteboard, UIActivityViewController) ne
    # cassaient donc qu'à l'archive macOS Xcode Cloud. Ce job compile la cible
    # macOS à chaque PR pour attraper ces régressions plus tôt.
    runs-on: macos-26
    timeout-minutes: 25

    env:
      PROJECT: Rclone GUI.xcodeproj
      SCHEME: Rclone GUI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build RcloneKit.xcframework (gomobile)
        run: ./scripts/build-rclone.sh

      - name: Build for macOS (compile check, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

  transparency-guard:
    name: Glass Engine — garde « 0 appel maison »
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier « 0 appel maison » (scan source, sans build)
        run: ./scripts/verify-no-phone-home.sh

  reproducible-build:
    name: Build reproductible (empreinte RcloneKit.xcframework)
    # Lourd (~20 min, build gomobile). Déclenché à la main uniquement — informatif,
    # ne bloque pas les PR. Le mainteneur régénère le manifeste via
    # `scripts/verify-reproducible.sh --record` après un build propre.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Rebuild du framework natif (déterministe)
        run: ./scripts/build-rclone.sh

      - name: Empreintes + garde 0 appel maison
        run: ./scripts/verify-reproducible.sh
